<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site sobre elementos Iframes. Inline Frame para embutir outros sites.">
    <title>Sobre Iframes</title>
</head>

<body>

    <h1>Iframe</h1>

    <hr>

    <h2> Para que serve?</h2>
    <p> o Inline Frame é um elemento que nos permite embutir outro documento dentro da nossa página. É bastante usado para youtube, Google, Maps, Formularios </p>

    <h3> Exemplo de Iframe</h3>

    <iframe src="04-imagens.html" frameborder="0"></iframe>

    <hr>
    <h3> Exemplo de Iframe com Youtube</h3>

    <iframe 
    width="430" 
    height="242" 
    src="https://www.youtube.com/embed/QdBZY2fkU-0?si=4eLm0sD0rJe1YCr5" 
    title="YouTube video player com o video do GTA VI" frameborder="0" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
</iframe>

<h3>Carregando mapas</h3>
<iframe
    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3656.905187882168!2d-46.65641968452099!3d-23.5642249846864!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce59c5e7b8e9b5%3A0x8a9c8e8e8e8e8e8e!2sAv.%20Paulista%2C%20S%C3%A3o%20Paulo%20-%20SP%2C%20Brasil!5e0!3m2!1spt-BR!2sus!4v1616161616161" 
        width="600" 
        height="450" 
        style="border:0;" 
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="strict-origin-when-cross-origin"
    
></iframe>


    

</body>

</html>

<!-- DOCTYPE - serve para indicar para os navegadores qual a versão e qual o padrão de HTML está sendo usado -->
<!DOCTYPE html>

<!-- HTML - Elemento raiz. Tudo que pertecnce ao documento HTML fica dentro dele -->

<!-- LANG/language (idioma) = Atributo resposavel pela linguagem do conteudo do site. Além disso, tem um impacto muito grande na acessibelidade e SEO   -->
<html lang="pt-br">


<head>

    <!-- Charset = essa congiguração serve para indicar para os navegadores qual padrao/codificação de caracteres usar. Isso permite, utilizar caracteres especiais e emojis.  -->
    <meta charset="UTF-8">

    <!-- Viewport = Configuração que controla o dimensionamento e a escala do conteúdo em dispositivos móveis, ajudando na responsavidade do site.  -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- title/título = Representa o título que aparece na aba do navegador para o usuário. -->
    <title>Olá mundo</title>
</head>

<!-- body/corpo = conteúdo visível da página web onde o usuario interage e consome recursos da pagina. Por exemplo: Títulos, paragrafos, imagens; formulários e etc. -->
<body>
    Olá, Mundo. Este é o primeiro programa em HTML.
</body>
</html>
